name: بناء SavageBlock لأندرويد

on:
  workflow_dispatch:
  push:
    paths:
      - "savageblock/**"
      - ".github/workflows/build-savageblock.yml"
  pull_request:
    paths:
      - "savageblock/**"

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: savageblock

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: فحص Lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: بناء نسخة التصحيح
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: بناء نسخة الإصدار (غير موقّعة)
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: رفع ملفات APK
        uses: actions/upload-artifact@v4
        with:
          name: SavageBlock-APKs
          path: |
            savageblock/app/build/outputs/apk/debug/*.apk
            savageblock/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
