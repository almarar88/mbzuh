name: نشر إصدار SavageBlock (APK)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "رقم الإصدار (مثال 1.0.0) — يُنشأ الوسم savageblock-v<version>"
        required: true
        default: "1.0.0"
  push:
    tags:
      - "savageblock-v*"

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: savageblock

    steps:
      - uses: actions/checkout@v4

      - name: تحديد رقم الإصدار
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF_NAME#savageblock-v}"
          else
            v="${{ github.event.inputs.version }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "الإصدار: $v"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Uses the repo secret SAVAGEBLOCK_KEYSTORE_BASE64 (+ SAVAGEBLOCK_STORE_PASS /
      # SAVAGEBLOCK_KEY_ALIAS / SAVAGEBLOCK_KEY_PASS) when configured, so every release
      # carries the same signature and installs as an update. Without the secret a
      # throw-away key is generated: the APK installs fine, but a later release signed
      # with a different throw-away key requires uninstalling first.
      - name: تجهيز مفتاح التوقيع
        env:
          KEYSTORE_BASE64: ${{ secrets.SAVAGEBLOCK_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.SAVAGEBLOCK_STORE_PASS }}
          KEY_ALIAS: ${{ secrets.SAVAGEBLOCK_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SAVAGEBLOCK_KEY_PASS }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            echo "SB_STORE_PASS=${STORE_PASS}" >> "$GITHUB_ENV"
            echo "SB_KEY_ALIAS=${KEY_ALIAS}" >> "$GITHUB_ENV"
            echo "SB_KEY_PASS=${KEY_PASS}" >> "$GITHUB_ENV"
            echo "SB_KEY_SOURCE=secret" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v -keystore release.jks -storetype PKCS12 \
              -alias savageblock -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass savageblock -keypass savageblock \
              -dname "CN=SavageBlock, OU=Alcode, O=Alcode, C=SA"
            echo "SB_STORE_PASS=savageblock" >> "$GITHUB_ENV"
            echo "SB_KEY_ALIAS=savageblock" >> "$GITHUB_ENV"
            echo "SB_KEY_PASS=savageblock" >> "$GITHUB_ENV"
            echo "SB_KEY_SOURCE=ephemeral" >> "$GITHUB_ENV"
          fi

      - name: فحص Lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: بناء APK الإصدار الموقّع
        run: |
          ./gradlew :app:assembleRelease --no-daemon \
            -PsbKeystore="$PWD/release.jks" \
            -PsbStorePass="$SB_STORE_PASS" \
            -PsbKeyAlias="$SB_KEY_ALIAS" \
            -PsbKeyPass="$SB_KEY_PASS"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/SavageBlock-${{ steps.ver.outputs.version }}.apk"
          cp app/build/outputs/mapping/release/mapping.txt "dist/SavageBlock-${{ steps.ver.outputs.version }}-mapping.txt"
          ls -la dist

      - name: التحقق من التوقيع
        run: |
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" \
            verify --print-certs "dist/SavageBlock-${{ steps.ver.outputs.version }}.apk"

      - name: رفع APK كمُخرَج
        uses: actions/upload-artifact@v4
        with:
          name: SavageBlock-${{ steps.ver.outputs.version }}
          path: savageblock/dist/*
          if-no-files-found: error

      - name: نشر الإصدار
        uses: softprops/action-gh-release@v2
        with:
          tag_name: savageblock-v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: SavageBlock ${{ steps.ver.outputs.version }}
          make_latest: false
          files: savageblock/dist/*
          body: |
            ## SavageBlock — كافي تضييع

            تطبيق أندرويد (8.0 فأحدث) يراقب وقتك على تطبيقات التضييع ويغطي الشاشة
            بتهزيء عدواني عند تجاوز الحد. يدعم الأجهزة القابلة للطي (Galaxy Z Fold وأمثاله)
            بتخطيط ثنائي الأعمدة عند فتح الشاشة.

            ### التثبيت
            1. نزّل `SavageBlock-${{ steps.ver.outputs.version }}.apk` وافتحه.
            2. اسمح بـ «تثبيت تطبيقات من مصادر غير معروفة» إذا طلب النظام.
            3. أعطِ التطبيق صلاحيتي **الوصول لبيانات الاستخدام** و**الظهور فوق التطبيقات** من شاشة البداية.

            > التطبيق موقّع ذاتيًا (مفتاح التوقيع: ${{ env.SB_KEY_SOURCE }}). Play Protect قد يعرض تحذيرًا
            > لأنه ليس من المتجر — اختر «تثبيت على أي حال».

            ---
            تطوير **Alcode**
