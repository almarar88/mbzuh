name: بناء ميزان لأندرويد

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "وسم الإصدار الذي سيُنشر (مثال mizan-v1.0.0)"
        required: true
        default: "mizan-v1.0.0"
  push:
    tags:
      - "mizan-v*"
    branches:
      - main
    paths:
      - "mizan_tools/**"
      - ".github/workflows/build-android.yml"
  pull_request:
    paths:
      - "mizan_tools/**"

permissions:
  contents: write

defaults:
  run:
    working-directory: mizan_tools

jobs:
  android-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: تثبيت الحزم
        run: flutter pub get

      - name: فحص الكود
        run: flutter analyze --no-fatal-infos

      - name: الاختبارات
        run: flutter test

      - name: بناء APK (كل المعالجات)
        run: flutter build apk --release

      - name: بناء APK مقسّم حسب المعالج (أصغر حجماً)
        run: flutter build apk --release --split-per-abi

      - name: تسمية الملفات
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/Mizan-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/Mizan-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk out/Mizan-armeabi-v7a.apk
          ls -la out

      - name: رفع الـAPK كمُخرَج
        uses: actions/upload-artifact@v4
        with:
          name: Mizan-Android-APK
          path: mizan_tools/out/*.apk
          if-no-files-found: error

      - name: نشر الإصدار
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/mizan-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ميزان ${{ github.event.inputs.tag || github.ref_name }}
          files: mizan_tools/out/*.apk
          body: |
            ## ميزان — أدواتك اليومية (أندرويد)

            | الملف | لمن |
            |---|---|
            | `Mizan-universal.apk` | يعمل على كل الأجهزة (الأكبر حجماً) |
            | `Mizan-arm64-v8a.apk` | معظم الهواتف الحديثة والأجهزة القابلة للطي (موصى به) |
            | `Mizan-armeabi-v7a.apk` | الأجهزة القديمة 32-بت |

            نزّل الملف وافتحه على الهاتف، ثم اسمح بالتثبيت من مصادر غير معروفة إن طُلب.
            التطبيق موقّع بمفتاح تطوير (غير منشور على المتجر)، لذا قد يظهر تحذير من Play Protect — اختر «تثبيت على أي حال».
