name: بناء منصّة الإداري (MBZUH Admin) لويندوز

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "وسم الإصدار الذي سيُنشر (مثال v2.0.0)"
        required: true
        default: "v2.0.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: تثبيت الاعتماديات
        run: npm ci

      - name: فحص الأنواع
        run: npm run typecheck

      - name: بناء ملف التثبيت
        run: npm run dist:win

      - name: رفع ملف التثبيت كمُخرَج
        uses: actions/upload-artifact@v4
        with:
          name: MBZUH-Admin-Setup-Windows
          path: release/MBZUH-Admin-Setup-*.exe
          if-no-files-found: error

      - name: نشر الإصدار
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: منصّة الإداري — MBZUH Admin ${{ github.event.inputs.tag || github.ref_name }}
          files: release/MBZUH-Admin-Setup-*.exe
          body: |
            ## منصّة الإداري — جامعة محمد بن زايد للعلوم الإنسانية

            ملف تثبيت لويندوز (64-بت). نزّل `MBZUH-Admin-Setup-*.exe` وشغّله
            واتبع خطوات التثبيت.

            - لوحة **نظام الجامعة الموحّد (UMS)** مدمجة داخل التطبيق بمظهر حديث.
            - **مساعد ذكاء اصطناعي** للمهام الإدارية (خطابات، بريد، تلخيص، ترجمة،
              تدقيق، استخراج المهام من المحاضر) — يحتاج مفتاح Claude API من الإعدادات.
            - **لوحة مهام** Kanban، إضافة إلى وحدات الدورات والمدربين والقاعات
              والتقارير والمحاضر.

            > قد يُظهر ويندوز تنبيه SmartScreen لأن الملف غير موقّع رقميًا —
            > اختر «مزيد من المعلومات» ثم «تشغيل على أي حال».

            ---
            تطوير **Alcode**
