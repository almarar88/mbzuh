appId: com.alcode.mbzuh-admin
productName: MBZUH Admin
copyright: © Alcode — منصّة الإداري، جامعة محمد بن زايد للعلوم الإنسانية
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
  - package.json
  - "!**/*.map"
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: MBZUH-Admin-${version}-win-${arch}.${ext}
  executableName: MBZUH-Admin
nsis:
  artifactName: MBZUH-Admin-Setup-${version}.${ext}
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: منصّة الإداري — MBZUH
  installerLanguages: [ar_SA, en_US]
  language: 1025
  deleteAppDataOnUninstall: false
