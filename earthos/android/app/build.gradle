plugins {
    id "com.android.application"
}

def webDir = rootProject.file("../www")
def webAssets = layout.buildDirectory.dir("generated/webassets")

android {
    namespace "com.alcode.earthos"
    compileSdk 34

    defaultConfig {
        applicationId "com.alcode.earthos"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    // Release signing: use a real keystore when the CI secrets are present,
    // otherwise fall back to the debug key so the APK is still installable.
    signingConfigs {
        release {
            def ksPath = System.getenv("EARTHOS_KEYSTORE_PATH")
            if (ksPath && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv("EARTHOS_KEYSTORE_PASSWORD")
                keyAlias System.getenv("EARTHOS_KEY_ALIAS")
                keyPassword System.getenv("EARTHOS_KEY_PASSWORD")
            } else {
                // AGP only creates ~/.android/debug.keystore lazily for the debug variant,
                // so make sure it exists before the release variant validates its signing config.
                def debugKs = new File(System.getProperty("user.home"), ".android/debug.keystore")
                if (!debugKs.exists()) {
                    debugKs.parentFile.mkdirs()
                    project.exec {
                        commandLine "keytool", "-genkeypair", "-keystore", debugKs.absolutePath,
                                "-storepass", "android", "-alias", "androiddebugkey", "-keypass", "android",
                                "-keyalg", "RSA", "-keysize", "2048", "-validity", "10000",
                                "-dname", "CN=Android Debug,O=Android,C=US"
                    }
                }
                storeFile debugKs
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    sourceSets {
        main { assets.srcDirs += webAssets }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "EarthOS-${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

// Copy the shared web app (earthos/www) into the APK assets as assets/www/…
tasks.register("copyWebAssets", Copy) {
    from(webDir)
    into(webAssets.map { it.dir("www") })
}
tasks.named("preBuild") { dependsOn("copyWebAssets") }

dependencies {
    // Align the transitive kotlin-stdlib / stdlib-jdk8 versions pulled in by appcompat and webkit.
    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.webkit:webkit:1.11.0"
    // Foldable posture detection (hinge bounds / tabletop & book modes)
    implementation "androidx.window:window:1.3.0"
    implementation "androidx.window:window-java:1.3.0"
}
